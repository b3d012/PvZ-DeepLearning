name: Phase 4 Offline Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  offline-tests:
    name: Offline tests (Windows / Python 3.12)
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project and pinned harness
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Verify frozen harness contract
        shell: pwsh
        run: python scripts/check_harness.py

      - name: Compile Python sources
        shell: pwsh
        run: python -m compileall -q src tests scripts

      - name: Run offline tests
        shell: pwsh
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Run masked learning smoke command
        shell: pwsh
        run: pvz-dl train --config configs/experiments/mock_smoke.yaml --output artifacts/ci-runs
